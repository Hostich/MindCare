{% extends "base.html" %}

{% block title %}
Verify Email
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/verify_email.css') }}">

<div class="verify-page">
    <div class="verify-header">
        <div class="verify-icon">&#9993;</div>
        <h1>Verify Your Email</h1>
        <p>We've sent a 6-digit code to your email. Enter it below to activate your MindCare account.</p>
    </div>

    <div class="verify-card">
        <form action="{{ url_for('auth.verify_email') }}" method="POST">

            <div class="input-group">
                <input type="text"
                       name="verification_code"
                       maxlength="6"
                       placeholder="Enter 6-digit code"
                       required>
            </div>

            <button type="submit" class="verify-btn">Verify</button>
        </form>

        <p class="resend-text">Didn't get a code? <a href="#">Resend</a></p>
    </div>
</div>
{% endblock %}
