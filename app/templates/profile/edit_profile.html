{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profile.css') }}">

<div class="edit-profile-page">

    <h2>Edit Profile</h2>

    <form method="POST">

        <label>First Name</label>
        <input
            type="text"
            name="first_name"
            value="{{ user.first_name or '' }}"
        >

        <label>Last Name</label>
        <input
            type="text"
            name="last_name"
            value="{{ user.last_name or '' }}"
        >

        <label>Phone Number</label>
        <input
            type="text"
            name="phone_number"
            value="{{ user.phone_number or '' }}"
        >

        <label>Occupation</label>
        <input
            type="text"
            name="occupation"
            value="{{ user.occupation or '' }}"
        >

        <label>Gender</label>

        <select name="gender">

            <option value="">Select Gender</option>

            <option value="Male"
            {% if user.gender == "Male" %}selected{% endif %}>
                Male
            </option>

            <option value="Female"
            {% if user.gender == "Female" %}selected{% endif %}>
                Female
            </option>

            <option value="Prefer not to say"
            {% if user.gender == "Prefer not to say" %}selected{% endif %}>
                Prefer not to say
            </option>

        </select>

        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
