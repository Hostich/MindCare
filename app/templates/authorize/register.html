{%extends 'base.html'%}
{%block title%}
REGISTER
{%endblock%}

{%block content%}
<link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

<div class="register-page">

	<div class="register-side">
		<div class="side-icon">&#9825;</div>
		<h1>MINDCARE</h1>
		<p>
			Join our community of support.<br>Your journey to better mental
			health starts here.
		</p>
		<div class="side-badge">All posts are 100% anonymous.<br>Your privacy is our priority.</div>
	</div>

	<div class="register-form-wrap">
		<h2>CREATE AN ACCOUNT</h2>

		<div class="register-card">
			<form action="{{ url_for('auth.register') }}" method="POST">

				<div class="input-group">
					<input type="text" name="username" placeholder="Username / Anonymous#1">
				</div>

				<div class="input-group">
					<input type="text" name="email" placeholder="Email Address">
				</div>

				<div class="input-group">
					<input type="text" name="phonenumber" placeholder="Phone Number">
				</div>

				<div class="input-group">
					<select name="occupation">
						<option value="" disabled selected>Occupation</option>
						<option value="student">Student</option>
						<option value="employed">Employed</option>
						<option value="self_employed">Self Employed</option>
						<option value="unemployed">Unemployed</option>
					</select>
				</div>

				<div class="input-group">
					<input type="password" name="password" placeholder="Password">
				</div>

				<div class="input-group">
					<input type="password" name="confirmpassword" placeholder="Confirm Password">
				</div>

				<button type="submit" class="register-btn">Sign Up</button>
			</form>

			<p class="login-text">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
		</div>
	</div>

</div>
{%endblock%}
