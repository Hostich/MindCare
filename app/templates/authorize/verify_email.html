{% extends "base.html" %}

{% block title %}
Verify Email
{% endblock %}

{% block content %}

<h2>Email Verification</h2>

<form action="{{ url_for('auth.verify_email') }}" method="POST">

    <label>Verification Code</label>

    <input
        type="text"
        name="verification_code"
        maxlength="6"
        required
    >

    <button type="submit">
        Verify
    </button>

</form>

{% endblock %}
