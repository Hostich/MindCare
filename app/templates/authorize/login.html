{%extends 'base.html'%}
{%block content%}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

<div class="login-page">
	<div class="login-header">
		<div class="login-icon">&#9825;</div>
		<h1>Welcome Back</h1>
		<p>Login to your MindCare account</p>
	</div>

	<div class="login-card">
		<h2>LOGIN</h2>

		<form method="POST">
			<div class="input-group">
				<input type="text" name="identifier" placeholder="Email Address" required>
			</div>

			<div class="input-group">
				<input type="password" name="password" placeholder="Password" required>
			</div>

			<button type="submit" class="login-btn">LOGIN</button>
		</form>

		<p class="signup-text">No Account? <a href="{{url_for('auth.register')}}">Sign Up</a></p>
	</div>
</div>
{%endblock%}
