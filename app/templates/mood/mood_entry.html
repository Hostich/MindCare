{% extends "base.html" %}

{% block title %}
Mood Check-In
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mood_entry.css') }}">

<div class="mood-page">

    <div class="mood-title-card">
        <h2>MOOD CHECK-IN</h2>
    </div>

    <form method="POST">

        <div class="mood-card">
            <h3>How are you feeling today?</h3>

            <div class="mood-options">

                <label class="mood-option">
                    <input type="radio" name="mood" value="Happy" required>
                    <span class="mood-emoji">&#128522;</span>
                    <span class="mood-label">Happy</span>
                </label>

                <label class="mood-option">
                    <input type="radio" name="mood" value="Calm">
                    <span class="mood-emoji">&#128524;</span>
                    <span class="mood-label">Calm</span>
                </label>

                <label class="mood-option">
                    <input type="radio" name="mood" value="Neutral">
                    <span class="mood-emoji">&#128528;</span>
                    <span class="mood-label">Neutral</span>
                </label>

                <label class="mood-option">
                    <input type="radio" name="mood" value="Sad">
                    <span class="mood-emoji">&#128546;</span>
                    <span class="mood-label">Sad</span>
                </label>

                <label class="mood-option">
                    <input type="radio" name="mood" value="Anxious">
                    <span class="mood-emoji">&#128543;</span>
                    <span class="mood-label">Anxious</span>
                </label>

                <label class="mood-option">
                    <input type="radio" name="mood" value="Angry">
                    <span class="mood-emoji">&#128544;</span>
                    <span class="mood-label">Angry</span>
                </label>

            </div>
        </div>

        <div class="note-card">
            <h4>Note</h4>
            <span class="optional-tag">(Optional)</span>
            <textarea name="note"
                      rows="6"
                      placeholder="How are you feeling? Any thoughts you want to note..."></textarea>
        </div>

        <button type="submit" class="confirm-btn">Continue</button>

    </form>

</div>
{% endblock %}
